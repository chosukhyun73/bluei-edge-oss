id: bap_sps
name: BAP 가공공장 기준 (SPS)
version: "Core 6.0 (GFSI 인정 전, 심사 중)"
checked_at: "2026-11-17"
min_retention_years: 3
retention_note: 기준은 유통기한 + 1년이다. 유통기한이 2년을 넘는 제품이면 더 길게 잡는다
items:
  - {id: cert, title: 유효한 BAP 인증서를 등록했다, required: true, check: "cert_own:bap"}
  - {id: plan, title: HACCP 계획(위해분석·공정흐름도·CCP)을 게시했다, clause: "3.1.1·3.1.2", required: true, check: plan_published}
  - {id: review, title: 작성자가 아닌 검토자 계정이 있다, clause: "2.10.3", required: true, check: reviewer_account}
  - {id: retention, title: 기록을 유통기한 + 1년 이상 보관한다, clause: "2.10.2", required: true, check: retention}
  - {id: monitoring, title: CCP 모니터링·개선조치 기록, clause: "3.1.7·3.1.8", required: true, check: later}
  - {id: raw, title: 입력에 쓴 원본 측정값 보관, clause: "6.1.2", required: true, check: later}
  - {id: kde, title: lot 별 추적 기록(운송 식별자·투입·순중량), clause: "6.2.1", required: true, check: later}
  - {id: trace_drill, title: 추적 훈련 100%·4시간, clause: "6.2.3", required: true, check: later}
  - {id: mock_recall, title: 모의 회수 연 1회, clause: "2.14", required: true, check: manual}
