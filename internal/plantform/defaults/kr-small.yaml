      - {id: c_kind, name: 공인·자체}
      - {id: c_official, name: 공인기관 검교정일}
      - {id: c_self, name: 자체 검교정일}
      - {id: c_next, name: 다음 예정일}
      - {id: c_note, name: 비고, width: 1.5}

  - id: calibration_record
    name: 자체 검교정 일지
    kind: sheet
    cycle: 매년
    owner: HACCP 팀장
    covers: [P11, H5]
    deviation: true
